services:
  backend:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        APP_ENV: ${APP_ENV:-development}
    container_name: erpflow-backend
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    command: ["/usr/local/bin/erpflow-backend-entrypoint"]
    expose:
      - "9000"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - erpflow

  nginx:
    image: nginx:1.28-alpine
    container_name: erpflow-nginx
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - erpflow

  frontend:
    image: node:22-alpine
    container_name: erpflow-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      CHOKIDAR_USEPOLLING: "true"
    command: sh -c "until [ -f package.json ]; do sleep 1; done; npm install && npm run dev -- --host 0.0.0.0"
    networks:
      - erpflow

  mysql:
    image: mysql:8.4
    container_name: erpflow-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-erpflow}
      MYSQL_USER: ${DB_USERNAME:-erpflow}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    networks:
      - erpflow

  etl:
    build:
      context: ./etl
      dockerfile: Dockerfile
    container_name: erpflow-etl
    working_dir: /app
    volumes:
      - ./etl:/app
    environment:
      PYTHONPATH: /app/src
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    command: ["tail", "-f", "/dev/null"]
    networks:
      - erpflow

networks:
  erpflow:
    driver: bridge

volumes:
  backend_vendor:
  mysql_data:
  frontend_node_modules:
